<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Card styling for the video */
        .video-card {
            width: 80%; /* Adjust to your desired card width */
            margin: 20px auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            overflow: hidden;
        }

        /* Video container now based on the video's intrinsic aspect ratio */
        .video-container {
            position: relative;
            display: block;
            max-width: 100%;
            background-color: #000; /* Optional background color */
        }

        .video-container video {
            width: 100%;
            height: auto; /* Let the height adjust based on width */
            max-width: 100%;
        }

        /* Sales popup container positioned at the top-right of the page */
        .sales-popup-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            z-index: 1000;
        }

    /* Styling for each sales popup card with reduced size */
    .sales-popup {
        display: flex;
        align-items: center;
        background-color: white; /* White background */
        color: black; /* Black text */
        padding: 8px 15px; /* Reduced padding */
        border-radius: 8px; /* Smooth corners */
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        opacity: 1;
        position: relative;
        animation: popupAnimation 2s ease-out forwards;
        transition: opacity 0.5s ease, transform 0.5s ease;
        width: 250px; /* Smaller width */
        font-size: 14px; /* Smaller font size */
    }

    /* Image container within each popup */
    .popup-image-container {
        width: 30px; /* Smaller image size */
        height: 30px; /* Smaller image size */
        margin-right: 8px; /* Reduced margin */
        overflow: hidden;
    }

    .popup-image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        cursor: pointer; /* Makes the image appear clickable */
    }

    /* Price in popup */
    .popup-price {
        margin-left: auto;
        font-weight: bold;
        font-size: 14px; /* Reduced font size for price */
        color: #000000; /* Black color for price */
    }

    /* Prevent text from wrapping */
    .sales-popup span:first-child {
        white-space: nowrap; /* Ensure the text stays in one line */
        font-size: 13px; /* Adjust font size for better fit */
        margin-right: 5px; /* Adjust margin if needed */
    }

    /* Animation for popup cards */
    @keyframes popupAnimation {
        0% {
            opacity: 0;
            transform: translateY(50px);
        }
        60% {
            opacity: 1;
            transform: translateY(0);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Fade-out animation for removal, moving upwards */
    @keyframes fadeOut {
        0% {
            opacity: 1;
            transform: translateY(0); /* Start at original position */
        }
        100% {
            opacity: 0;
            transform: translateY(-50px); /* Move upwards as it fades out */
        }
    }

    </style>
</head>
<body>
    <header class="top-bar">
        <div class="logo-container">
            <img id="channelLogo" src="shopify.png" alt="Channel Logo" />
        </div>
    
        <div class="profile">
            <div class="profile-icon">MA</div>
            <div class="profile-name">Mike Angelo</div>
        </div>
    </header>

    <div class="container">
        <section class="video-section">
            <div class="video-card">
                <div class="video-container">
                    <video id="salesVideo" controls>
                        <source src="shopify.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
        </section>
    </div>

    <!-- Sales Popup Container -->
    <div id="salesPopupContainer" class="sales-popup-container"></div>

    <script>
        const salesPopupContainer = document.getElementById('salesPopupContainer');
        const videoElement = document.getElementById('salesVideo');
    
        let popupCount = 0;
        const maxPopups = 3; // Only allow up to 3 popups at once
        let totalPopups = 0; // Track the total number of popups
    
        // Function to generate random price
        function getRandomPrice() {
            return (Math.random() * (1000 - 50) + 50).toFixed(2); // Random price between $50 and $1000
        }
    
        // Function to create a new sales popup card
        function createSalesPopup() {
            if (totalPopups >= 20) {
                // Stop and reset the page after 20 popups
                setTimeout(() => {
                    window.location.reload(); // Reset the page
                }, 1500); // Delay for 1.5 seconds before reloading the page for smooth transition
    
                return; // Exit the function to prevent further popups after 20
            }
    
            let popup = document.createElement('div');
            popup.classList.add('sales-popup');
    
            // Popup with image container and price
            popup.innerHTML = `
                <div class="popup-image-container">
                    <img src="pop.jpg" alt="Shopify Icon" />
                </div>
                <span>A purchase just happened!</span>
                <span class="popup-price">$${getRandomPrice()}</span>
            `;
    
            // Add the event listener directly to the image after it is created
            const image = popup.querySelector('img');
            image.addEventListener('click', function () {
                window.location.href = 'index.html'; // Redirect to index.html when the image is clicked
            });
    
            salesPopupContainer.appendChild(popup);
            totalPopups++;
    
            // Once 3 popups are stacked, start removing them one by one
            if (salesPopupContainer.children.length > maxPopups) {
                removeSalesPopup();
            }
        }
    
        // Function to remove the first popup card after a delay with smooth fade-out going up
        function removeSalesPopup() {
            let allPopups = salesPopupContainer.children;
            if (allPopups.length > 0) {
                let firstPopup = allPopups[0];
                firstPopup.style.animation = 'fadeOut 0.5s forwards'; // Trigger fade-out animation with upwards motion
    
                setTimeout(() => {
                    firstPopup.remove();  // Remove the card after fade-out animation completes
                }, 500);  // Fade-out duration matches the animation
            }
        }
    
        // Trigger popups after video ends
        videoElement.addEventListener('ended', () => {
            // Create the first popup immediately, and then continue creating them with random delays
            const popupInterval = () => {
                if (totalPopups < 20) {
                    createSalesPopup();
    
                    // Set a random delay between 1 to 3 seconds for the next popup
                    let randomDelay = Math.floor(Math.random() * (3000 - 1000) + 1000); // Random between 1 and 3 seconds
                    setTimeout(popupInterval, randomDelay); // Continue after the random delay
                } else {
                    // After 20 popups, stop and reset the page
                    setTimeout(() => {
                        window.location.reload(); // Reset the page after 20 popups
                    }, 1500); // Wait for some time before reloading
                }
            };
    
            popupInterval(); // Start the first popup immediately
        });
    
        // Function to remove all remaining popups after 20 popups
        function removeAllSalesPopups() {
            let allPopups = salesPopupContainer.children;
            while (allPopups.length > 0) {
                let popup = allPopups[0];
                popup.style.animation = 'fadeOut 0.5s forwards';  // Trigger fade-out animation with upwards motion
    
                setTimeout(() => {
                    popup.remove();  // Remove the card after it fades out
                }, 500);  // Fade-out duration matches the animation
            }
        }
    </script>
    

    <script src="scripts.js"></script>
</body>
</html>
