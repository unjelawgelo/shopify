<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top-bar">
        <h1>Overview Dashboard</h1>
        <div class="profile">
            <div class="profile-icon">MA</div>
            <div class="profile-name">Mike Angelo</div>
        </div>
    </header>

    <div class="container">
        <section class="earnings-section">
            <h2>Your Earnings</h2>
            <p class="stat-value" id="totalEarnings">$1,200,000.00</p>
            <p class="stat-description">Annual revenue based on current sales data.</p>
        </section>

        <section class="metrics-section">
            <h3>Key Metrics</h3>
            <ul>
                <li>Total Orders: <span>30,000</span></li>
                <li>Average Order Value: <span>$40.00</span></li>
                <li>Conversion Rate: <span>2.5%</span></li>
            </ul>
        </section>

        <section class="breakdown-section">
            <h3>Sales Breakdown</h3>
            <table>
                <thead>
                    <tr>
                        <th>Channel</th>
                        <th>Revenue</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Online Store</td>
                        <td>$700,000.00</td>
                    </tr>
                    <tr>
                        <td>Amazon</td>
                        <td>$500,000.00</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
